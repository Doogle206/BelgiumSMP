<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            color: #222;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .card h2 {
            font-size: 18px;
            margin: 0 0 12px;
        }
        .card img {
            width: 100%;
            max-width: 180px;
            height: auto;
            aspect-ratio: 180 / 432;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
            object-fit: cover;
        }
        @media (max-width: 960px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Staff</h1>
        <div class="grid">
            <div class="card">
                <h2>Zwente</h2>
                <img src="https://mc-heads.net/body/wood_gost" alt="Naam 1" width="432" height="180">
            </div>
            <div class="card">
                <h2>Willoosspie</h2>
                <img src="https://mc-heads.net/body/Willoosspie" alt="Naam 2" width="432" height="180">
            </div>
            <div class="card">
                <h2>Alexander</h2>
                <img src="https://mc-heads.net/body/Itsalexi" alt="Naam 3" width="432" height="180">
            </div>
            <div class="card">
                <h2>Doogle</h2>
                <img src="https://mc-heads.net/body/Doogle" alt="Naam 4" width="432" height="180">
            </div>
            <div class="card">
                <h2>Lennie</h2>
                <img src="https://mc-heads.net/body/Tc_Zeonx" alt="Naam 5" width="432" height="180">
            </div>
            <div class="card">
                <h2>Dynos</h2>
                <img src="https://mc-heads.net/body/Dynos" alt="Naam 6" width="432" height="180">
            </div>
            <div class="card">
                <h2>Bolt</h2>
                <img src="https://mc-heads.net/body/TheDragonBolt" alt="Naam 7" width="432" height="180">
            </div>
        </div>
    </div>
</body>
</html>
