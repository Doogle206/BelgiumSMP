<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff</title>
    <style>
        
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #0d0d0d;
        color: #eee;
    }

    .container {
        max-width: 1440px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #ffd900;
        font-size: 42px;
        letter-spacing: 2px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
    }

    .card {
        background: #161616;
        border: 2px solid #ffd900;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 0 15px rgba(255, 217, 0, 0.15);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 0 25px rgba(255, 217, 0, 0.35);
    }

    .card h2 {
        font-size: 20px;
        margin: 0 0 16px;
        color: #ffd900;
    }

    .card img {
        width: 100%;
        max-width: 180px;
        height: auto;
        aspect-ratio: 180 / 432;
        border-radius: 8px;
        display: block;
        margin: 0 auto;
        object-fit: cover;
    }

    @media (max-width: 960px) {
        .grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 640px) {
        .grid {
            grid-template-columns: 1fr;
        }
    }
</style>
    </style>
</head>
<body>
    <div class="container">
        <h1>Staff</h1>
        <div class="grid">
            <div class="card">
                <h2>Zwente</h2>
                <img src="https://mc-heads.net/body/wood_gost" alt="Naam 1" width="432" height="180">
            </div>
            <div class="card">
                <h2>Willoos_spie</h2>
                <img src="https://mc-heads.net/body/Willoos_spie" alt="Naam 2" width="432" height="180">
            </div>
            <div class="card">
                <h2>Alexander</h2>
                <img src="https://mc-heads.net/body/Itsalexi_" alt="Naam 3" width="432" height="180">
            </div>
            <div class="card">
                <h2>Doogle</h2>
                <img src="https://mc-heads.net/body/Doogle" alt="Naam 4" width="432" height="180">
            </div>
            <div class="card">
                <h2>Lennart</h2>
                <img src="https://mc-heads.net/body/Tc_Zeonx" alt="Naam 5" width="432" height="180">
            </div>
            <div class="card">
                <h2>Dynos</h2>
                <img src="https://mc-heads.net/body/Dynos10" alt="Naam 6" width="432" height="180">
            </div>
            <div class="card">
                <h2>Bolt</h2>
                <img src="https://mc-heads.net/body/TheDragonBolt" alt="Naam 7" width="432" height="180">
            </div>
        </div>
    </div>
</body>
</html>
